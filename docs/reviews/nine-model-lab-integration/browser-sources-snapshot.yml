        - paragraph [ref=f2e35]: Draft Mašín2005 Appendix C five-parameter clay base law with effective Cauchy stress and void ratio. Compression-positive infinitesimal Mandel strain-path rates in a fixed spatial frame at zero spin. Generic exact-input normalized_determinant(sigma) preserves the source homogeneous ratio. Conservative numerical SPD/invariant interior, explicit Lode allowance and finite-intermediate restrictions; no clipping or stress floor. Source Table I London-clay defaults and spherical100kPa/e=.8 are illustrative software inputs, not a matched prepared specimen or Wichtmann calibration. Instantaneous-rate evidence is separate from the prospective finite-path study; source preparation, final-publisher equivalence, finite rotation, consistent tangent and scientific admission remain unresolved.

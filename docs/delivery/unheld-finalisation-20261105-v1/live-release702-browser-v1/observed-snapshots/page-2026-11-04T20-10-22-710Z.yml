            - paragraph [ref=e97]: Supply the initial effective stress and void ratio. A numerically admissible state still needs to represent the material’s actual preparation.
          - generic [ref=e98]:
            - heading "Scope and limitations" [level=3] [ref=e99]
            - paragraph [ref=e100]: The Atlas formulation uses three-dimensional small strain, fixed spatial axes and compression-positive stress and strain. Stresses are effective stresses; the surrounding drainage formulation supplies any pore-pressure response. Changing elapsed time alone does not produce creep or relaxation.
            - paragraph [ref=e101]: There is no yielding, hardening, density-dependent stiffness or plastic volume change. The stored void ratio is bookkeeping and does not affect stress.

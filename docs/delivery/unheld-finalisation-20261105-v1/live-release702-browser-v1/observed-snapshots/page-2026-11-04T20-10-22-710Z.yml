          - paragraph [ref=e65]: "Linear isotropic elasticity is a useful baseline: stress changes in direct proportion to strain, and the material has the same stiffness in every direction."
          - generic [ref=e66]:
            - heading "What it describes" [level=3] [ref=e67]
            - generic [ref=e68]:
              - term [ref=e69]: Elastic loading and unloading
              - definition [ref=e70]: Returning along the strain path reverses the stress change.
              - term [ref=e71]: Volume and shape changes
              - definition [ref=e72]: Two constants determine the resistance to compression and shear.
          - generic [ref=e73]:
            - heading "Explore the response" [level=3] [ref=e74]
            - paragraph [ref=e75]: Choose Drained triaxial and a small monotonic strain. Compare two Young-modulus values while keeping the initial stress and Poisson ratio fixed. The stress–strain slope changes.
            - paragraph [ref=e76]: Try unloading through a strain cycle to see the reversible response.
          - generic [ref=e77]:

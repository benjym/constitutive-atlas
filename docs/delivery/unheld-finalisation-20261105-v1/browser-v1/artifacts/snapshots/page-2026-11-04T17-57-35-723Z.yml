          - paragraph [ref=e63]: A simple reversible response with constant stiffness and no permanent deformation.
          - paragraph [ref=e64]: "Linear isotropic elasticity is a useful baseline: stress changes in direct proportion to strain, and the material has the same stiffness in every direction."
          - generic [ref=e65]:
            - heading "What it describes" [level=3] [ref=e66]
            - generic [ref=e67]:
              - term [ref=e68]: Elastic loading and unloading
              - definition [ref=e69]: Returning along the strain path reverses the stress change.
              - term [ref=e70]: Volume and shape changes
              - definition [ref=e71]: Two constants determine the resistance to compression and shear.
          - generic [ref=e72]:
            - heading "Explore the response" [level=3] [ref=e73]
            - paragraph [ref=e74]: Choose Drained triaxial and a small monotonic strain. Compare two Young-modulus values while keeping the initial stress and Poisson ratio fixed. The stress–strain slope changes.
            - paragraph [ref=e75]: Try unloading through a strain cycle to see the reversible response.
          - generic [ref=e76]:
            - heading "Material parameters" [level=3] [ref=e77]

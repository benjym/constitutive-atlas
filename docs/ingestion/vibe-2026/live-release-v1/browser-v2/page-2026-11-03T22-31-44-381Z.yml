          - heading "Viscohypoplastic bentonite (VIBE, Mašín 2026)" [level=2] [ref=e236]
          - paragraph [ref=e237]: VIBE combines swelling within clay aggregates, deformation between aggregates and elapsed time to describe the coupled stress and water-retention response of bentonite.
          - paragraph [ref=e238]: Net Cauchy stress · compression positive · infinitesimal strain in fixed axes with zero spin. Suction is positive air minus water pressure. Time is in seconds.
          - generic [ref=e239]:
            - text: Starting example
            - combobox "Starting example" [ref=e240]:

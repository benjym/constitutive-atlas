              - option "Heating and drying · 100 seconds"
              - option "Drying then wetting"
              - option "Six-component mechanical loading"
              - option "Mechanical loading then reversal"
              - option "Combined mechanical, thermal and hydraulic loading"
          - paragraph [ref=e241]: Hold every imposed field fixed near the asymptotic state boundary. Viscosity relaxes net stress while void ratio and hydraulic memory remain fixed.

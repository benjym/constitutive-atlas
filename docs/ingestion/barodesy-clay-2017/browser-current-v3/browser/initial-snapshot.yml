        - paragraph [ref=f1e33]: Recorded description. Review status in this text reflects when it was written; see the accepted review for its current scope. Draft laboratory preview of Medicus–Fellin2017 body Eqs1–10 at zero spin. Seven physical states; compression-positive effective Cauchy stress and void ratio. Selects body2p critical density, not Appendix6p; no claim of author-code equivalence or resolved printed spin expression. Conservative positive-definite stress interior and bounded matrix exponential; exact zero/hydrostatic continuations are project numerical choices. Default Table2 soil parameters and stress/e are examples, not a matched experimental preparation. No experimental validation, independent scientific admission, finite rotation or validated zero/near-hydrostatic update tangent. Use explicit state; source and retained research evidence are linked.

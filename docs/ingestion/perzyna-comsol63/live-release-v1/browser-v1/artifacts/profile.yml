      - heading "COMSOL 6.3 Perzyna elastoviscoplastic solid · associative von Mises" [level=2] [ref=f2e8]
    - generic [ref=f2e9]:
      - generic [ref=f2e10]:
        - paragraph [ref=f2e11]: An elastic solid whose permanent shear deformation accelerates nonlinearly as stress rises above a fixed yield threshold.
        - paragraph [ref=f2e12]: The Perzyna solid combines reversible elastic deformation with time-dependent permanent deformation. Below its yield stress it responds elastically. Above yield, the excess stress relative to the yield stress controls the flow rate through a power law. This separates the onset of permanent deformation from the speed at which it develops.
        - generic [ref=f2e13]:
          - heading "What it describes" [level=3] [ref=f2e14]
          - generic [ref=f2e15]:
            - term [ref=f2e16]: A threshold followed by nonlinear flow
            - definition [ref=f2e17]: The von Mises equivalent stress measures the combined intensity of stress that changes shape. Flow begins above the yield stress. The exponent controls how sharply its rate increases with relative overstress; mean stress alone produces no permanent flow.
            - term [ref=f2e18]: Relaxation toward the yield stress
            - definition [ref=f2e19]: During a strain hold, an initially overstressed solid develops permanent strain and loses deviatoric stress. Its stress approaches the yield threshold while mean stress remains constant. For an exponent greater than one, relaxation slows particularly strongly near yield.
            - term [ref=f2e20]: Steady creep under a stress hold
            - definition [ref=f2e21]: Holding an above-yield stress fixed produces continuing strain at a constant rate. Increasing the rate coefficient speeds this response. A larger exponent reduces flow when relative overstress is below one and increases it when relative overstress is above one.
            - term [ref=f2e22]: Permanent deformation without strengthening
            - definition [ref=f2e23]: The yield threshold remains fixed as permanent strain accumulates. On reversal, stress can cross an elastic interval before opposite flow develops. Accumulated equivalent permanent strain continues to grow even when tensor components reverse.
        - generic [ref=f2e24]:
          - heading "Compare a strain hold with a stress hold" [level=3] [ref=f2e25]
          - paragraph [ref=f2e26]: In the laboratory, use Reset Perzyna preset to load the complete example. Choose Relaxation · hold all strains under Physical-time experiment, then Run physical-time history. Inspect total stress and accumulated equivalent viscoplastic strain against physical time. Use Plot component · Mandel to inspect normal and shear components; the yield threshold applies to their combined equivalent stress.
          - paragraph [ref=f2e27]: "Reset the Perzyna preset and choose Creep · hold all stresses. Stress now stays fixed while strain grows. Increase A while keeping the other coefficients and complete starting state fixed to obtain faster creep and relaxation. Compare n at the same initial state: the effect depends on whether relative overstress is smaller or larger than one. Loading · constant strain rate applies all six rates together for the selected duration."
        - generic [ref=f2e28]:
          - heading "Material parameters" [level=3] [ref=f2e29]
          - paragraph [ref=f2e30]: Use a consistent stress unit for both moduli and yield stress, and seconds for physical time. The example coefficients are illustrative and require identification for a particular material and temperature. The implemented regular-exponent interval is one through eight; numerical accuracy is qualified only for the disclosed studies and examples.
          - table [ref=f2e31]:
            - rowgroup [ref=f2e32]:
              - row "Parameter Meaning Units" [ref=f2e33]
            - rowgroup [ref=f2e37]:
              - row "K · Elastic bulk modulus Controls reversible resistance to volume change; permanent flow is volume preserving. Pa" [ref=f2e38]
              - row "G · Elastic shear modulus Controls reversible resistance to shape change and helps set the relaxation time. Pa" [ref=f2e42]
              - row "σy · Equivalent yield stress Sets the onset of flow and the normalization of overstress. Changing it affects both the threshold and the flow rate. Pa" [ref=f2e46]
              - row "A · Viscoplastic rate coefficient Multiplies the flow rate at every fixed relative overstress. Its unit is inverse seconds. s⁻¹" [ref=f2e50]
              - row "n · Overstress exponent Sets the nonlinear dependence on stress above yield. At a stress twice the yield stress, relative overstress is one and the equivalent permanent-strain rate equals A for every exponent. dimensionless" [ref=f2e54]
        - generic [ref=f2e58]:
          - heading "Starting state" [level=3] [ref=f2e59]
          - paragraph [ref=f2e60]: Supply six total-strain components, six viscoplastic-strain components and accumulated equivalent viscoplastic strain α, plus all five parameters and physical start time. Stress follows from total strain minus permanent strain. Tensor entries use [xx, yy, zz, √2xy, √2yz, √2xz]. Permanent strain is traceless, α is nonnegative, and accumulated strain must be consistent with the supplied permanent strain. A preset is an illustrative starting context rather than a specimen preparation procedure. Restart retains all thirteen components.
        - generic [ref=f2e61]:
          - heading "Scope and limitations" [level=3] [ref=f2e62]
          - paragraph [ref=f2e63]: The printed COMSOL 6.3 Perzyna mathematical law with isotropic linear elasticity, associated von Mises flow, constant yield stress and no hardening. Three-dimensional infinitesimal strain, fixed spatial axes, compression-positive stress and strain, dry total Cauchy stress and physical time are used. The exponent is restricted to the regular range n≥1.
          - paragraph [ref=f2e64]: There is no evolving strength, back stress, damage, temperature dependence, pore-fluid response or permanent volume change. Finite strains and rotation transport are excluded. The selected law normalizes overstress by the yield stress; an independent reference-stress normalization is a different realization. Custom histories and coefficients need their own accuracy checks.

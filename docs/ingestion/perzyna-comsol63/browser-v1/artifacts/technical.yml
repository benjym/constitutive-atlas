    - paragraph [ref=e857]: The main laboratory provides a strain hold, stress hold and all-six constant strain rate for the printed COMSOL6.3 Perzyna law. Isotropic elasticity, associative von Mises flow and a constant yield stress use thirteen explicit strain/history components and five parameters K,G,σy,A,n. Stress is dry total Cauchy stress, with infinitesimal strain, fixed spatial axes and zero spin. This realization selects the printed yield-normalized equation with exponent n; the vendor settings page differs, so software equivalence is not claimed. Examples are illustrative; custom coefficients, states and times need accuracy checks. No experimental validation is supplied.

  - dialog [ref=f2e1]:
    - generic [ref=f2e2]:
      - banner [ref=f2e3]:
        - generic [ref=f2e4]:
          - generic [ref=f2e5]: anisotropic critical-state plasticity
          - generic [ref=f2e6]: Available in laboratory
        - button "Close model details" [ref=f2e7] [cursor=pointer]: ×
        - heading "S-CLAY1 — Wheeler et al. (2003)" [level=2] [ref=f2e8]
      - generic [ref=f2e9]:
        - generic [ref=f2e339]:
          - paragraph [ref=f2e340]: A soft-clay plasticity model that represents directional yielding and changes in fabric during permanent deformation.
          - paragraph [ref=f2e341]: "Soft clay can retain a preferred direction from its deposition and loading history. S-CLAY1 describes this plastic anisotropy with an inclined yield surface: the boundary between elastic response and further permanent deformation changes with the material’s internal fabric."
          - generic [ref=f2e342]:
            - heading "What it describes" [level=3] [ref=f2e343]
            - generic [ref=f2e344]:
              - term [ref=f2e345]: Directional yielding
              - definition [ref=f2e346]: The stress needed to reach yielding depends on the loading direction relative to the clay’s fabric. A tilted yield surface distinguishes this response from an isotropic clay idealization.
              - term [ref=f2e347]: Fabric evolution
              - definition [ref=f2e348]: Plastic volumetric and shear deformation change the fabric and therefore the inclination of the yield surface. The hardening law assigns different target directions to these two contributions.
              - term [ref=f2e349]: Yield-surface size
              - definition [ref=f2e350]: Plastic volumetric deformation also changes the size of the yield surface. This size change is distinct from its rotation.
          - generic [ref=f2e351]:
            - heading "Explore fabric evolution" [level=3] [ref=f2e352]
            - paragraph [ref=f2e353]: Choose Drained triaxial, Monotonic ramp, 1% axial strain and 100 increments. Keep the illustrative initial stress, fabric, specific volume and yield-surface size. The material constants follow the original Otaniemi example; the stress state is an Atlas interior starting point, not a reconstructed specimen.
            - paragraph [ref=f2e354]: Repeat with fabric rotation rate μ = 10 or 50, keeping all other inputs unchanged. Compare the stress and volume response. Undrained triaxial at the same 1% and 100 increments is also supported. These monotonic examples explore the law; they do not reproduce measured curves.
          - generic [ref=f2e355]:
            - heading "Material parameters" [level=3] [ref=f2e356]
            - paragraph [ref=f2e357]: Compression indices use specific volume against natural logarithm of pressure. Material constants and initial fabric require calibration together; the original Otaniemi values illustrate one clay and do not supply universal defaults.
            - table [ref=f2e358]:
              - rowgroup [ref=f2e359]:
                - row [ref=f2e360]:
                  - columnheader "Parameter" [ref=f2e361]
                  - columnheader "Meaning" [ref=f2e362]
                  - columnheader "Example value and units" [ref=f2e363]
              - rowgroup [ref=f2e364]:
                - row [ref=f2e365]:
                  - rowheader "λ · Virgin compression slope" [ref=f2e366]
                  - cell "Specific-volume change against natural logarithm of pressure after yielding." [ref=f2e367]
                  - cell "0.44 · dimensionless" [ref=f2e368]
                - row [ref=f2e369]:
                  - rowheader "κ · Elastic swelling slope" [ref=f2e370]
                  - cell "Controls recoverable volume change and pressure-dependent stiffness." [ref=f2e371]
                  - cell "0.04 · dimensionless" [ref=f2e372]
                - row [ref=f2e373]:
                  - rowheader "M · Critical-state stress ratio" [ref=f2e374]
                  - cell "Sets the shear-to-mean-stress ratio at critical state, with one value for all directions here." [ref=f2e375]
                  - cell "1.1 · dimensionless" [ref=f2e376]
                - row [ref=f2e377]:
                  - rowheader "ν′ · Elastic Poisson ratio" [ref=f2e378]
                  - cell "Relates elastic shear and bulk stiffness." [ref=f2e379]
                  - cell "0.2 · dimensionless" [ref=f2e380]
                - row [ref=f2e381]:
                  - rowheader "β · Shear contribution to fabric rotation" [ref=f2e382]
                  - cell "Balances the fabric changes caused by plastic shear and plastic compression." [ref=f2e383]
                  - cell "0.67 · dimensionless" [ref=f2e384]
                - row [ref=f2e385]:
                  - rowheader "μ · Fabric rotation rate" [ref=f2e386]
                  - cell "Controls how quickly plastic straining changes the preferred yielding direction." [ref=f2e387]
                  - cell "20 · dimensionless" [ref=f2e388]
          - generic [ref=f2e389]:
            - heading "Starting state" [level=3] [ref=f2e390]
            - paragraph [ref=f2e391]: Supply effective stress, specific volume v=1+e, positive yield-surface size and a traceless fabric tensor in the same axes. The starting stress must lie inside or on the inclined yield surface. The source estimates initial fabric from normally consolidated lateral stress only when one-dimensional preparation and predominantly plastic straining are appropriate. The candidate combines published Otaniemi constants with an illustrative stress state; it is not a prepared specimen.
          - generic [ref=f2e392]:
            - heading "Scope and limitations" [level=3] [ref=f2e393]
            - paragraph [ref=f2e394]: Original constant-M full tensor S-CLAY1 at infinitesimal strain, compression-positive effective stress and fixed spatial axes. Main-laboratory qualification covers monotonic drained and undrained triaxial paths at 1% axial strain and 100 increments, plus the named bounded parameter edits in the technical evidence. It is rate independent.
            - paragraph [ref=f2e395]: Intended for normally or lightly overconsolidated soft clay. Simple elastic unloading does not capture small-strain nonlinearity or realistic cyclic stiffness. Bonding, destructuration and creep are absent; the paper reports substantial post-yield volume discrepancies for sensitive natural clay. Predictions dominated by dry-side plastic dilation are unreliable. S-CLAY1S adds bonding and its degradation and is a different formulation.

          - paragraph [ref=e250]: σₙ₊₁ = σₙ + C Δε, C = S⁻¹. The normal compliance block has diagonal (1/E1, 1/E2, 1/E3) and symmetric off-diagonals S12 = −ν12/E1, S13 = −ν13/E1, S23 = −ν23/E2. Mandel shear compliance is diagonal (1/(2G12), 1/(2G23), 1/(2G13)). All remaining entries vanish. Positive-definite compliance is required.
          - paragraph [ref=e251]: Atlas uses compression-positive stress and strain. Simultaneous reversal from a tension-positive representation leaves the stiffness unchanged; the inspected source does not explicitly label its scalar sign convention. Simultaneously reversing stress and strain yields this compression-positive convention without changing C. The fixed material axes are aligned with x,y,z. The strain-increment map uses the common declarative engine; all six stress components commit on a successful row, while a failed row rolls back to the incoming state. Zero increment holds stress. There is no physical time or finite-rotation transport.

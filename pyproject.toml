[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutive-atlas"
version = "0.1.0"
description = "Declarative geomechanical models and reproducible material-point experiments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
constitutive-atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

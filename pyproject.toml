[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutive-atlas"
version = "0.1.0"
description = "Declarative geomechanical models and reproducible material-point experiments"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "Benjy Marks"}, {name = "François Guillard"}]
maintainers = [{name = "Benjy Marks"}, {name = "François Guillard"}]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8,<4"]
data = ["h5py>=3.12,<4", "openpyxl>=3.1,<4", "scipy>=1.14,<2", "xlrd>=2.0.1,<3"]

[project.urls]
Repository = "https://github.com/benjym/constitutive-atlas"
Website = "https://benjym.github.io/constitutive-atlas/"

[project.scripts]
constitutive-atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

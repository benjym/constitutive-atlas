    timeout-minutes: 180
  controlled-path:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
    - name: Check controlled-path contracts and existing formulation semantics
      run: python -B -m unittest tests.test_controlled_path tests.test_formulation
        tests.test_state_contract -q
    - name: Build and qualify native controlled paths
      shell: bash
      run: |
        path_models="$PWD/models/research/norsand/norsand-jefferies-1993-active-axial.json;$PWD/tests/fixtures/controlled-path/synthetic-curved.json;$PWD/tests/fixtures/controlled-path/synthetic-model.json"
        cmake -S cmake/controlled-path -B build-path-native -DCMAKE_BUILD_TYPE=Debug "-DATLAS_PATH_MODELS=$path_models"
        cmake --build build-path-native --target atlas_path_capability --parallel 1
        mkdir -p path-results
        python -B docs/ingestion/norsand-1993/e2-v3/run_native_requests_v2.py build-path-native/libatlas_path_capability.so docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/native.json
        python -B docs/ingestion/norsand-1993/e2-v3/check_backend_results_v3.py docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/native.json
    - name: Cache pinned Emscripten SDK
      id: emsdk-cache
      uses: actions/cache@v4
      with:
        path: "${{ runner.temp }}/emsdk"
        key: emsdk-${{ runner.os }}-${{ runner.arch }}-6.0.8-v1
    - name: Install the pinned Emscripten SDK
      shell: bash
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.8
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.8
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
    - name: Build Wasm and require both backends to pass the same frozen gates
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        path_models="$PWD/models/research/norsand/norsand-jefferies-1993-active-axial.json;$PWD/tests/fixtures/controlled-path/synthetic-curved.json;$PWD/tests/fixtures/controlled-path/synthetic-model.json"
        emcmake cmake -S cmake/controlled-path -B build-path-wasm -DCMAKE_BUILD_TYPE=Debug "-DATLAS_PATH_MODELS=$path_models"
        cmake --build build-path-wasm --target atlas_path_capability --parallel 1
        node docs/ingestion/norsand-1993/e2-v3/run_wasm_requests_v2.mjs build-path-wasm/atlas_path_capability.mjs build-path-wasm/atlas_path_capability.wasm docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/wasm.json
        python -B docs/ingestion/norsand-1993/e2-v3/check_backend_results_v3.py docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/native.json path-results/wasm.json
    - name: Qualify the fully rough hypoplastic interface on native and Wasm
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        model="$PWD/models/research/interface2016/hvwe2016-reconciled-fixed-local.json"
        cmake -S cmake/controlled-path -B build-interface2016-native -DCMAKE_BUILD_TYPE=Release "-DATLAS_PATH_MODELS=$model"
        cmake --build build-interface2016-native --target atlas_path_capability --parallel 1
        mkdir -p path-results/interface2016
        python -B docs/ingestion/norsand-1993/e2-v3/run_native_requests_v2.py build-interface2016-native/libatlas_path_capability.so docs/ingestion/hypoplastic-interface-2016/implementation-v1/backend-requests.json path-results/interface2016/native.json
        python -B docs/ingestion/hypoplastic-interface-2016/implementation-v1/check_backend_results_v2.py path-results/interface2016/native.json --output path-results/interface2016/native-check.json
        emcmake cmake -S cmake/controlled-path -B build-interface2016-wasm -DCMAKE_BUILD_TYPE=Release "-DATLAS_PATH_MODELS=$model"
        cmake --build build-interface2016-wasm --target atlas_path_capability --parallel 1
        node docs/ingestion/norsand-1993/e2-v3/run_wasm_requests_v2.mjs build-interface2016-wasm/atlas_path_capability.mjs build-interface2016-wasm/atlas_path_capability.wasm docs/ingestion/hypoplastic-interface-2016/implementation-v1/backend-requests.json path-results/interface2016/wasm.json
        python -B docs/ingestion/hypoplastic-interface-2016/implementation-v1/check_backend_results_v2.py path-results/interface2016/wasm.json --output path-results/interface2016/wasm-check.json
        python -B docs/ingestion/hypoplastic-interface-2016/execution-v1/check_parity_v2.py path-results/interface2016/native.json path-results/interface2016/wasm.json path-results/interface2016/parity.json
    - name: Retain numerical outputs and generated model metadata
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: controlled-path-qualification
        path: |
          path-results/
          build-path-native/generated/
          build-path-wasm/generated/
          build-path-native/CMakeCache.txt
          build-path-wasm/CMakeCache.txt
          build-interface2016-native/generated/
          build-interface2016-wasm/generated/
          build-interface2016-native/CMakeCache.txt
          build-interface2016-wasm/CMakeCache.txt
          build-path-native/libatlas_path_capability.so
          build-path-wasm/atlas_path_capability.mjs
          build-path-wasm/atlas_path_capability.wasm
    timeout-minutes: 180
  result:
    if: always()
    needs:
    - native
    - wasm
    - wasm-linux
    - controlled-path
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: "${{ toJSON(needs) }}"
      run: python3 -c 'import json,os; assert all(j["result"] == "success" for j in
        json.loads(os.environ["RESULTS"]).values())'

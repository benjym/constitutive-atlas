    timeout-minutes: 180
  wasm-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
    - name: Cache pinned Emscripten SDK
      id: emsdk-cache
      uses: actions/cache@v4
      with:
        path: "${{ runner.temp }}/emsdk"
        key: emsdk-${{ runner.os }}-${{ runner.arch }}-6.0.8-v1
    - name: Install the official pinned Emscripten SDK
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.8
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.8
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
    - name: 'Verify Linux browser engine and packaged website / 1: source "$RUNNER_TEMP/emsdk/emsdk_env.sh"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target atlas_solver --parallel 1
        emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-wasm --target atlas_solver --parallel 1
        cmake --build build-wasm --target atlas_power_creep_solver --parallel 1
        cmake --build build-wasm --target atlas_scalar_probe --parallel 1

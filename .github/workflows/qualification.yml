---
name: Full qualification
'on':
  push:
    branches:
    - main
    paths:
    - atlas/**
    - cpp/**
    - cmake/**
    - CMakeLists.txt
    - models/**
    - schemas/**
    - tests/**
    - tools/**
    - catalogue/**
    - data/**
    - ".github/**"
    - docs/**/*.py
    - docs/**/*.mjs
    - docs/**/*.json
    - docs/**/*.zip
    - docs/**/*.gz
  pull_request:
    paths:
    - atlas/**
    - cpp/**
    - cmake/**
    - CMakeLists.txt
    - models/**
    - schemas/**
    - tests/**
    - tools/**
    - catalogue/**
    - data/**
    - ".github/**"
    - docs/**/*.py
    - docs/**/*.mjs
    - docs/**/*.json
    - docs/**/*.zip
    - docs/**/*.gz
  schedule:
  - cron: 17 15 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.12'
        - os: macos-26
          python: '3.14'
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python }}"
    - run: python -m atlas.cli validate
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - run: python tools/build_ci_targets.py build
    - name: Qualify common scalar functions against independent references
      shell: bash
      run: |
        cmake --build build --target atlas_scalar_probe --parallel 1
        case "$RUNNER_OS" in
          Linux) scalar_extension=so ;;
          macOS) scalar_extension=dylib ;;
        esac
        python -B tools/test_scalar_functions.py "build/libatlas_scalar_probe.$scalar_extension" --output-dir "$RUNNER_TEMP/scalar-native"
    - name: Qualify Bingham through its approved BE schedule interface
      run: |
        set -euo pipefail
        python -B tests/test_cmake_profile_build_v2.py
        mkdir -p "$RUNNER_TEMP/bingham-build-receipts/time-predictor" "$RUNNER_TEMP/bingham-build-receipts/time-tests" "$RUNNER_TEMP/bingham-build-receipts/time-solver" "$RUNNER_TEMP/bingham-build-receipts/bingham-native"
        cmake -S cmake/physical-time-v2 -B build-time-v2 -G "Unix Makefiles" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-configure.log"
        cmake --build build-time-v2 --target atlas_schedule_predictor_tests --parallel 1 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/atlas_schedule_predictor_tests-build.log"
        cmake --build build-time-v2 --target atlas_time_tests --parallel 1 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/atlas_time_tests-build.log"
        cmake --build build-time-v2 --target atlas_time_solver --parallel 1 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/atlas_time_solver-build.log"
        python3 -B tools/record_cmake_profile_build_v2.py capture --root "$PWD" --build build-time-v2 --target atlas_schedule_predictor_tests --entrypoint tests/test_schedule_predictor.cpp --models tests/fixtures/time --recipe cmake/physical-time-v2/CMakeLists.txt --schedule required --kind native --artifact atlas_schedule_predictor_tests --consumer-tool python3 --consumer-tool python --consumer-tool node --consumer-source tests/test_time.py --consumer-source tests/test_schedule.py --receipt "$RUNNER_TEMP/bingham-build-receipts/time-predictor/pre.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-predictor/capture.log"
        time_predictor_pre_sha="$(cat "$RUNNER_TEMP/bingham-build-receipts/time-predictor/pre.json".sha256)"
        build-time-v2/atlas_schedule_predictor_tests 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-predictor/consumer.log"
        python3 -B tools/record_cmake_profile_build_v2.py verify --receipt "$RUNNER_TEMP/bingham-build-receipts/time-predictor/pre.json" --receipt-sha256 "$time_predictor_pre_sha" --output "$RUNNER_TEMP/bingham-build-receipts/time-predictor/post.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-predictor/verify.log"
        python3 -B tools/record_cmake_profile_build_v2.py capture --root "$PWD" --build build-time-v2 --target atlas_time_tests --entrypoint tests/test_time.cpp --models tests/fixtures/time --recipe cmake/physical-time-v2/CMakeLists.txt --schedule absent --kind native --artifact atlas_time_tests --consumer-tool python3 --consumer-tool python --consumer-tool node --consumer-source tests/test_time.py --consumer-source tests/test_schedule.py --receipt "$RUNNER_TEMP/bingham-build-receipts/time-tests/pre.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-tests/capture.log"
        time_tests_pre_sha="$(cat "$RUNNER_TEMP/bingham-build-receipts/time-tests/pre.json".sha256)"
        build-time-v2/atlas_time_tests 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-tests/consumer.log"
        python3 -B tools/record_cmake_profile_build_v2.py verify --receipt "$RUNNER_TEMP/bingham-build-receipts/time-tests/pre.json" --receipt-sha256 "$time_tests_pre_sha" --output "$RUNNER_TEMP/bingham-build-receipts/time-tests/post.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-tests/verify.log"
        python3 -B tools/record_cmake_profile_build_v2.py capture --root "$PWD" --build build-time-v2 --target atlas_time_solver --entrypoint cpp/main.cpp --models tests/fixtures/time --recipe cmake/physical-time-v2/CMakeLists.txt --schedule required --kind native --artifact atlas_time_solver --consumer-tool python3 --consumer-tool python --consumer-tool node --consumer-source tests/test_time.py --consumer-source tests/test_schedule.py --receipt "$RUNNER_TEMP/bingham-build-receipts/time-solver/pre.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-solver/capture.log"
        time_solver_pre_sha="$(cat "$RUNNER_TEMP/bingham-build-receipts/time-solver/pre.json".sha256)"
        ATLAS_TIME_SOLVER="$PWD/build-time-v2/atlas_time_solver" python3 -B -m unittest tests.test_time tests.test_schedule 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-solver/consumer.log"
        python3 -B tools/record_cmake_profile_build_v2.py verify --receipt "$RUNNER_TEMP/bingham-build-receipts/time-solver/pre.json" --receipt-sha256 "$time_solver_pre_sha" --output "$RUNNER_TEMP/bingham-build-receipts/time-solver/post.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/time-solver/verify.log"
        cmake -S cmake/bingham -B build-bingham -G "Unix Makefiles" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/bingham-native-configure.log"
        cmake --build build-bingham --target atlas_bingham_solver --parallel 1 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/bingham-native-build.log"
        python3 -B tools/record_cmake_profile_build_v2.py capture --root "$PWD" --build build-bingham --target atlas_bingham_solver --entrypoint cpp/main.cpp --models models/research/bingham --recipe cmake/bingham/CMakeLists.txt --schedule required --kind native --artifact atlas_bingham_solver --consumer-tool python3 --consumer-tool python --consumer-tool node --consumer-source tools/test_bingham_schedule.py --consumer-source docs/ingestion/bingham-comsol63/execution-v5/study.py --consumer-source docs/ingestion/bingham-comsol63/execution-v5/collect_wasm.mjs --consumer-source docs/ingestion/bingham-comsol63/execution-v5/parity.py --consumer-source docs/ingestion/bingham-comsol63/execution-v5/oracle.py --consumer-source docs/ingestion/bingham-comsol63/execution-v5/synthetic_checks.py --consumer-source docs/ingestion/bingham-comsol63/execution-v5/expected-catalogue.json --consumer-source docs/ingestion/bingham-comsol63/execution-v5/reference-convergence.json --consumer-source docs/ingestion/bingham-comsol63/execution-v5/cases.json --consumer-source docs/ingestion/bingham-comsol63/execution-v5/freeze-v1.json --consumer-source docs/ingestion/bingham-comsol63/execution-v5/source-bindings.json --receipt "$RUNNER_TEMP/bingham-build-receipts/bingham-native/pre.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/bingham-native/capture.log"
        bingham_native_pre_sha="$(cat "$RUNNER_TEMP/bingham-build-receipts/bingham-native/pre.json".sha256)"
        python -B tools/test_bingham_schedule.py --solver build-bingham/atlas_bingham_solver --output "$RUNNER_TEMP/bingham-native.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/bingham-native/consumer.log"
        python3 -B tools/record_cmake_profile_build_v2.py verify --receipt "$RUNNER_TEMP/bingham-build-receipts/bingham-native/pre.json" --receipt-sha256 "$bingham_native_pre_sha" --output "$RUNNER_TEMP/bingham-build-receipts/bingham-native/post.json" 2>&1 | tee "$RUNNER_TEMP/bingham-build-receipts/bingham-native/verify.log"
        node --test tests/test_bingham_laboratory_contract.mjs
    - name: Retain Bingham native qualification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bingham-native-${{ matrix.os }}
        path: "${{ runner.temp }}/bingham-*"
    - name: Qualify Perzyna through its reviewed BE schedule interface
      run: python3 -B tools/check_perzyna_ci.py --output "${{ runner.temp }}/perzyna-native"
    - name: Retain Perzyna native qualification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: perzyna-native-${{ matrix.os }}
        path: "${{ runner.temp }}/perzyna-native/"
    - name: Build and qualify the approved Kelvin–Voigt physical-time model
      run: |
        cmake -S cmake/kelvin-voigt -B build-kelvin-voigt -DCMAKE_BUILD_TYPE=Release
        cmake --build build-kelvin-voigt --target atlas_kelvin_voigt_solver --parallel 1
        python tools/test_kelvin_voigt_native.py --solver build-kelvin-voigt/atlas_kelvin_voigt_solver --output "$RUNNER_TEMP/kelvin-voigt-native.json"
        node --test tests/test_kelvin_voigt_contract.mjs tests/test_kelvin_voigt_routing.mjs tests/test_chart_axis.mjs
    - name: Retain Kelvin–Voigt native qualification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kelvin-voigt-native-${{ matrix.os }}
        path: "${{ runner.temp }}/kelvin-voigt-native.json"
    - name: Build and qualify the approved SLS physical-time model
      run: |
        cmake -S cmake/sls -B build-sls -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-sls --target atlas_sls_solver --parallel 1
        python tools/test_sls_native.py --solver build-sls/atlas_sls_solver --output "$RUNNER_TEMP/sls-native.json"
        node --test tests/test_sls_laboratory_contract.mjs tests/test_laboratory_controller_router.mjs
    - name: Build and qualify the approved orthotropic strain-increment model
      run: |
        cmake -S cmake/orthotropic -B build-orthotropic -DCMAKE_BUILD_TYPE=Release
        cmake --build build-orthotropic --target atlas_orthotropic_solver --parallel 1
        python tools/test_orthotropic_native.py --solver build-orthotropic/atlas_orthotropic_solver --output "$RUNNER_TEMP/orthotropic-native"
        node --test tests/test_orthotropic_contract.mjs
    - name: Retain orthotropic native qualification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orthotropic-native-${{ matrix.os }}
        path: "${{ runner.temp }}/orthotropic-native/"
    - name: Build and qualify the approved J2 strain-increment model
      run: |
        cmake -S cmake/j2 -B build-j2 -DCMAKE_BUILD_TYPE=Release
        cmake --build build-j2 --target atlas_j2_solver --parallel 1
        python tools/test_j2_native.py --solver build-j2/atlas_j2_solver --output "$RUNNER_TEMP/j2-native"
        node --test tests/test_j2_contract.mjs tests/test_j2_main_routing.mjs
    - name: Build and qualify Burgers physical-time schedules
      run: |
        cmake -S cmake/burgers -B build-burgers -DCMAKE_BUILD_TYPE=Release
        cmake --build build-burgers --target atlas_burgers_solver --parallel 1
        python tools/test_burgers_native.py build-burgers/atlas_burgers_solver "$RUNNER_TEMP/burgers-native"
        node --test tests/test_burgers_web_contract.mjs
    - name: Qualify Ramberg–Osgood against independent scalar references
      run: |
        cmake -S . -B build-ramberg-qualified -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-ffp-contract=off
        cmake --build build-ramberg-qualified --target atlas_solver --parallel 1
        python -B tools/check_ramberg_osgood.py --solver build-ramberg-qualified/atlas_solver --save-responses "$RUNNER_TEMP/ramberg-native.json" --output "$RUNNER_TEMP/ramberg-native-checks.json"
    - name: Build and qualify Hill anisotropic plasticity
      run: |
        cmake -S cmake/hill -B build-hill -DCMAKE_BUILD_TYPE=Release
        cmake --build build-hill --target atlas_hill_solver --parallel 1
        python tools/test_hill_native.py --solver build-hill/atlas_hill_solver --output "$RUNNER_TEMP/hill-native"
        node --test tests/test_hill_contract.mjs
    - name: Retain Hill native qualification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hill-native-${{ matrix.os }}
        path: "${{ runner.temp }}/hill-native/"
    - name: Native numerical checks with frozen MD1997 Decimal assessment
      run: python -B tools/check_md1997_numerical_ci.py --build build --output "$RUNNER_TEMP/md1997-numerical"
    - name: Retain native numerical assessment and raw output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: numerical-native-${{ matrix.os }}
        path: "${{ runner.temp }}/md1997-numerical/"
    # v6 inherits explicit-gis20-occ-restart-duncan-v5 and adds constrained S-CLAY1 fixtures.
    - name: Native checks and full exact archival replay
      if: runner.os == 'macOS'
      run: |
        ctest --test-dir build --output-on-failure -E "^(atlas_numerical|atlas_recorded)$"
        ATLAS_NATIVE_FIXTURES=explicit-gis20-occ-restart-duncan-sclay1-v6 ctest --test-dir build --output-on-failure -R "^atlas_recorded$"
      env:
        ATLAS_NATIVE_FIXTURES: explicit-gis20-occ-restart-duncan-sclay1-v6
    - name: Linux native checks
      if: runner.os == 'Linux'
      run: |
        ctest --test-dir build --output-on-failure -E "^(atlas_numerical|atlas_python|atlas_recorded)$"
        ATLAS_NATIVE_FIXTURES=explicit-gis20-occ-restart-duncan-sclay1-v6 ctest --test-dir build --output-on-failure -R "^atlas_recorded$"
      env:
        ATLAS_NATIVE_FIXTURES: explicit-gis20-occ-restart-duncan-sclay1-v6
    - name: Retain strict original native failures and reject unknown fixtures
      run: python tools/check_native_fixture_contracts.py --build build --output "$RUNNER_TEMP/native-fixture-contracts.json"
    - name: Linux portable Python suite
      if: runner.os == 'Linux'
      env:
        ATLAS_SOLVER: "${{ github.workspace }}/build/atlas_solver"
        ATLAS_TIME_SOLVER: "${{ github.workspace }}/build/atlas_time_solver"
        ATLAS_RESEARCH_SOLVER: "${{ github.workspace }}/build/atlas_research_solver"
        ATLAS_HISTORY_SOLVER: "${{ github.workspace }}/build/atlas_history_solver"
        ATLAS_CLAY2013_SOLVER: "${{ github.workspace }}/build/atlas_clay2013_solver"
        ATLAS_GIS2024_SOLVER: "${{ github.workspace }}/build/atlas_gis2024_solver"
      run: python -B tools/run_ci_tests.py --portable
    - name: Verify recorded-path JSON replay
      env:
        ATLAS_RECORDED_SOLVER: "${{ github.workspace }}/build/atlas_solver"
      run: python -m unittest tests.test_experiment_replay tests.test_recorded_api
        tests.test_recorded_path tests.test_web_recorded tests.test_refinement tests.test_isotropic_reference
        tests.test_resolution_diagnosis tests.test_recorded_restarts -v
    timeout-minutes: 180
  wasm:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
    - name: Cache pinned Emscripten SDK
      id: emsdk-cache
      uses: actions/cache@v4
      with:
        path: "${{ runner.temp }}/emsdk"
        key: emsdk-${{ runner.os }}-${{ runner.arch }}-6.0.8-v1
    - name: Install the official pinned Emscripten SDK
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.8
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.8
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
    - name: 'Build and compare native and Wasm / 1: source "$RUNNER_TEMP/emsdk/emsdk_env.sh"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        python tools/build_ci_targets.py build
        emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
        python tools/build_ci_targets.py build-wasm --wasm
        cmake --build build-wasm --target atlas_scalar_probe --parallel 1
        node tools/collect_scalar_functions_wasm.mjs build-wasm/scalar-functions.js "$RUNNER_TEMP/scalar-wasm-raw.json"
        python -B tools/check_scalar_functions.py "$RUNNER_TEMP/scalar-wasm-raw.json" "$RUNNER_TEMP/scalar-wasm-assessment.json"
        node tools/test_experiments.mjs
        node tools/test_wasm.mjs --profile-policy catalogue/laboratory-profile-policy.json
    - name: 'Build and compare native and Wasm / 2: cmake -S . -B build-ramberg-qualified
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-ffp-contract=off'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        cmake -S . -B build-ramberg-qualified -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-ffp-contract=off
        cmake --build build-ramberg-qualified --target atlas_solver --parallel 1
        python -B tools/check_ramberg_osgood.py --solver build-ramberg-qualified/atlas_solver --save-responses "$RUNNER_TEMP/ramberg-native.json" --output "$RUNNER_TEMP/ramberg-native-checks.json"
        node tools/check_ramberg_osgood_wasm.mjs build-wasm "$RUNNER_TEMP/ramberg-wasm.json" "$RUNNER_TEMP/ramberg-native.json"
        python -B tools/check_ramberg_osgood.py --responses "$RUNNER_TEMP/ramberg-wasm.json" --output "$RUNNER_TEMP/ramberg-wasm-checks.json"
        node tools/test_numerics.mjs --wasm build-wasm/atlas.js --native build/atlas_solver
        node tools/test_loading.mjs
        node tools/test_browser_loading.mjs build/atlas_solver build-wasm "$RUNNER_TEMP/browser-loading.json" catalogue/laboratory-profile-policy.json
        node tools/test_scoped_parity.mjs build/atlas_solver build-wasm "$RUNNER_TEMP/scoped-parity.json" catalogue/laboratory-profile-policy.json
        node tools/test_recorded.mjs --wasm build-wasm/atlas.js --native build/atlas_solver
    - name: 'Build and compare native and Wasm / 3: history_cases --output "$RUNNER_TEMP/history-cases.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python -m tools.history_cases --output "$RUNNER_TEMP/history-cases.json"
        node tools/test_history_wasm.mjs --cases "$RUNNER_TEMP/history-cases.json"
        node tools/test_time_wasm.mjs
        node tools/test_schedule_wasm.mjs
        node tools/test_terracotta_wasm.mjs
        node tools/test_terracotta_creep_wasm.mjs --output "$RUNNER_TEMP/terracotta-creep-parity.json"
        python -m tools.verify_terracotta_creep_wasm "$RUNNER_TEMP/terracotta-creep-parity.json"
    - name: 'Build and compare native and Wasm / 4: clay2013_integration_study --output
        "$RUNNER_TEMP/clay2013-native.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python -m tools.clay2013_integration_study --output "$RUNNER_TEMP/clay2013-native.json"
        node tools/test_clay2013_wasm.mjs --native-report "$RUNNER_TEMP/clay2013-native.json" --wasm build-wasm/clay2013.js --output "$RUNNER_TEMP/clay2013-wasm.json"
        python -m tools.verify_clay2013_wasm "$RUNNER_TEMP/clay2013-wasm.json"
    - name: 'Build and compare native and Wasm / 5: clay2013_nonisotropic_study --output
        "$RUNNER_TEMP/clay2013-path-native.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python -m tools.clay2013_nonisotropic_study --output "$RUNNER_TEMP/clay2013-path-native.json"
        node tools/test_research_matrix_wasm.mjs --native-report "$RUNNER_TEMP/clay2013-path-native.json" --wasm build-wasm/clay2013.js --output "$RUNNER_TEMP/clay2013-path-wasm.json"
        python -m tools.verify_research_matrix_wasm "$RUNNER_TEMP/clay2013-path-wasm.json"
    - name: 'Build and compare native and Wasm / 6: gis2024_rate_study --output "$RUNNER_TEMP/gis2024-native.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python -m tools.gis2024_rate_study --output "$RUNNER_TEMP/gis2024-native.json"
        node tools/test_research_matrix_wasm.mjs --native-report "$RUNNER_TEMP/gis2024-native.json" --wasm build-wasm/gis2024.js --output "$RUNNER_TEMP/gis2024-wasm.json"
        python -m tools.verify_research_matrix_wasm "$RUNNER_TEMP/gis2024-wasm.json"
    - name: 'Build and compare native and Wasm / 7: gis2024_integration_study --output
        "$RUNNER_TEMP/gis2024-path-native.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python -m tools.gis2024_integration_study --output "$RUNNER_TEMP/gis2024-path-native.json"
        node tools/test_gis2024_paths_wasm.mjs --native-report "$RUNNER_TEMP/gis2024-path-native.json" --wasm build-wasm/gis2024.js --output "$RUNNER_TEMP/gis2024-path-wasm.json"
        python -m tools.verify_gis2024_paths "$RUNNER_TEMP/gis2024-path-wasm.json"
    - name: 'Build and compare native and Wasm / 8: python tools/expm_study.py --binary
        build/atlas_expm_probe --output "$RUNNER_TEMP/expm-native.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python tools/expm_study.py --binary build/atlas_expm_probe --output "$RUNNER_TEMP/expm-native.json"
        node tools/test_expm_wasm.mjs --native-report "$RUNNER_TEMP/expm-native.json" --wasm build-wasm/expm-fixtures.js --output "$RUNNER_TEMP/expm-wasm.json"
        python tools/expm_study.py --verify "$RUNNER_TEMP/expm-wasm.json" --native-report "$RUNNER_TEMP/expm-native.json"
    - name: 'Build and compare native and Wasm / 9: log1p_study --binary build/atlas_log1p_probe
        --output "$RUNNER_TEMP/log1p-native.json"'
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        python -m tools.log1p_study --binary build/atlas_log1p_probe --output "$RUNNER_TEMP/log1p-native.json"

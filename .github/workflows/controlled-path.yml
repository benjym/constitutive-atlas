name: Controlled-path qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-then-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Check controlled-path contracts and existing formulation semantics
        run: python -B -m unittest tests.test_controlled_path tests.test_formulation tests.test_state_contract -q
      - name: Build and qualify native controlled paths
        shell: bash
        run: |
          path_models="$PWD/models/research/norsand/norsand-jefferies-1993-active-axial.json;$PWD/tests/fixtures/controlled-path/synthetic-curved.json;$PWD/tests/fixtures/controlled-path/synthetic-model.json"
          cmake -S cmake/controlled-path -B build-path-native -DCMAKE_BUILD_TYPE=Debug "-DATLAS_PATH_MODELS=$path_models"
          cmake --build build-path-native --target atlas_path_capability --parallel 1
          mkdir -p path-results
          python -B docs/ingestion/norsand-1993/e2-v3/run_native_requests_v2.py build-path-native/libatlas_path_capability.so docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/native.json
          python -B docs/ingestion/norsand-1993/e2-v3/check_backend_results_v3.py docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/native.json
      - name: Install the pinned Emscripten SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.8
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.8
      - name: Build Wasm and require both backends to pass the same frozen gates
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          path_models="$PWD/models/research/norsand/norsand-jefferies-1993-active-axial.json;$PWD/tests/fixtures/controlled-path/synthetic-curved.json;$PWD/tests/fixtures/controlled-path/synthetic-model.json"
          emcmake cmake -S cmake/controlled-path -B build-path-wasm -DCMAKE_BUILD_TYPE=Debug "-DATLAS_PATH_MODELS=$path_models"
          cmake --build build-path-wasm --target atlas_path_capability --parallel 1
          node docs/ingestion/norsand-1993/e2-v3/run_wasm_requests_v2.mjs build-path-wasm/atlas_path_capability.mjs build-path-wasm/atlas_path_capability.wasm docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/wasm.json
          python -B docs/ingestion/norsand-1993/e2-v3/check_backend_results_v3.py docs/ingestion/norsand-1993/e2-v3/backend-requests-v2.json path-results/native.json path-results/wasm.json
      - name: Retain numerical outputs and generated model metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-path-qualification
          path: |
            path-results/
            build-path-native/generated/
            build-path-wasm/generated/
            build-path-native/CMakeCache.txt
            build-path-wasm/CMakeCache.txt
            build-path-native/libatlas_path_capability.so
            build-path-wasm/atlas_path_capability.mjs
            build-path-wasm/atlas_path_capability.wasm

---
name: Publish Pages
'on':
  workflow_run:
    workflows:
    - Fast CI
    types:
    - completed
    branches:
    - main
  workflow_dispatch:
    inputs:
      replay_studies:
        description: Run the independent package studies without deploying
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  ATLAS_PUBLICATION_REVISION: "${{ github.event.workflow_run.head_sha || github.sha }}"
jobs:
  package:
    if: "(github.event_name == 'workflow_run' && github.event.workflow_run.conclusion
      == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch
      == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
    - uses: "./.github/actions/setup-atlas"
      with:
        wasm: 'true'
    - name: Verify publication checkout
      run: test "$(git rev-parse HEAD)" = "$ATLAS_PUBLICATION_REVISION"
    - name: Download the ordinary engine tested by Fast CI
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@v5
      with:
        name: tested-ordinary-wasm
        path: build-wasm
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
    - name: Build the power-creep engine and the ordinary engine for manual runs
      run: |
        # Configure separately so a manual build cannot overwrite a tested artifact.
        emcmake cmake -S . -B build-power-creep-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-power-creep-wasm --target atlas_power_creep_solver --parallel 1
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --target atlas_solver --parallel 1
        fi
    - name: Build kelvin-voigt Wasm engine
      run: |-
        emcmake cmake -S cmake/kelvin-voigt -B build-kelvin-voigt-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-kelvin-voigt-wasm --target atlas_kelvin_voigt_solver --parallel 1
    - name: Build sls Wasm engine
      run: |-
        emcmake cmake -S cmake/sls -B build-sls-wasm -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-sls-wasm --target atlas_sls_solver --parallel 1
    - name: Build j2 Wasm engine
      run: |-
        emcmake cmake -S cmake/j2 -B build-j2-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-j2-wasm --target atlas_j2_solver --parallel 1
    - name: Build burgers Wasm engine
      run: |-
        emcmake cmake -S cmake/burgers -B build-burgers-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-burgers-wasm --target atlas_burgers_solver --parallel 1
    - name: Build orthotropic Wasm engine
      run: |-
        emcmake cmake -S cmake/orthotropic -B build-orthotropic-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-orthotropic-wasm --target atlas_orthotropic_solver --parallel 1
    - name: Prepare approved engine assets and data
      run: |-
        python3 -B tools/provision_bingham_assets.py
        python3 -B tools/provision_perzyna_assets.py
        python3 -B docs/ingestion/lade-duncan-1975/atlas-integration-v1/live-release-v1/restore_interface_request.py
        python3 -B tools/provision_implicit_path_assets.py
        python3 -B tools/fetch_data.py --approved-only
    - name: Build the website package
      env:
        REPLAY_STUDIES: ${{ inputs.replay_studies }}
      run: |
        args=(--power-creep-wasm-dir build-power-creep-wasm)
        if [ "$REPLAY_STUDIES" != true ]; then args+=(--package-checks-only); fi
        GITHUB_SHA="$ATLAS_PUBLICATION_REVISION" python3 -B tools/build_web.py "${args[@]}"
    - name: Smoke-test the package that will deploy
      run: |
        node tools/ci_smoke.mjs --wasm web/dist/atlas.js
        node tools/test_experiments.mjs --built-assets web/dist/experiments
        node --test tests/test_database_download_gate.mjs tests/test_web_package.mjs
    - name: Check the laboratory and guided experiment in Chromium
      run: |
        npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save playwright@1.54.2
        "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
        NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" node tools/test_pages_browser.cjs web/dist
    - uses: actions/configure-pages@v6
      if: ${{ !inputs.replay_studies }}
    - name: Upload the tested website
      if: ${{ !inputs.replay_studies }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: web/dist
  deploy:
    if: ${{ !inputs.replay_studies }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
    - name: Deploy the tested artifact
      id: deployment
      uses: actions/deploy-pages@v5
